<!doctype html>
<html>
  <head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
        <h1>Weather App</h1>

        <div class="header-controls">
          <div class="toggle-container" aria-label="Temperature units">
            <span aria-hidden="true">°C</span>
            <label class="switch" for="unitToggle">
              <input
                type="checkbox"
                id="unitToggle"
                aria-label="Toggle between Celsius and Fahrenheit"
              />
              <span class="slider"></span>
            </label>
            <span aria-hidden="true">°F</span>
          </div>

          <div class="theme-toggle-container">
            <label class="theme-switch" for="themeToggle">
              <input
                type="checkbox"
                id="themeToggle"
                aria-label="Toggle dark mode"
              />
              <span class="theme-slider"></span>
            </label>
          </div>
        </div>
      </header>

      <div class="input-group">
        <label class="sr-only" for="cityInput">City name</label>
        <input
          id="cityInput"
          type="search"
          aria-label="City search"
          autocomplete="off"
          placeholder="Enter city name"
        />
        <button
          id="searchBtn"
          type="button"
          aria-label="Search weather for city"
        >
          Search
        </button>
      </div>

      <div
        id="searchSuggestions"
        class="search-suggestions"
        aria-live="polite"
      ></div>

      <button id="locationBtn" type="button" aria-label="Use current location">
        Use Current Location
      </button>

      <div id="statusMessage" class="status-message" aria-live="polite"></div>

      <div
        id="weatherAlert"
        class="weather-alert hidden"
        aria-live="polite"
      ></div>

      <div class="weather-actions">
        <button id="favoriteBtn" type="button" aria-pressed="false">
          ☆ Save City
        </button>
      </div>

      <div
        id="weatherResult"
        class="weather-result empty-state"
        aria-live="polite"
      >
        <h2 id="city">No city selected</h2>
        <img id="weatherIcon" src="" alt="" style="display: none" />
        <p id="temp">Search for a city to see the weather.</p>
        <p id="condition"></p>
        <p id="humidity"></p>
        <p id="wind"></p>
      </div>

      <div id="weatherDetails" class="weather-details" aria-live="polite"></div>

      <div
        id="favoritesContainer"
        class="favorites-container"
        aria-live="polite"
      ></div>

      <div
        id="hourlyForecastContainer"
        class="hourly-forecast empty"
        aria-live="polite"
      >
        Hourly forecast will appear here after a successful search.
      </div>

      <div id="forecastContainer" class="forecast-empty" aria-live="polite">
        Forecast will appear here after a successful search.
      </div>
    </div>
    <script src="config.js"></script>
    <script src="weather-logic.js"></script>
    <script src="script.js"></script>
  </body>
</html>
