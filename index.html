<!doctype html>
<html>
  <head>
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Weather App</h1>

      <div class="toggle-container" aria-label="Temperature units">
        <span aria-hidden="true">°C</span>
        <label class="switch" for="unitToggle">
          <input
            type="checkbox"
            id="unitToggle"
            aria-label="Toggle between Celsius and Fahrenheit"
          />
          <span class="slider"></span>
        </label>
        <span aria-hidden="true">°F</span>
      </div>

      <div class="input-group">
        <label class="sr-only" for="cityInput">City name</label>
        <input
          id="cityInput"
          type="search"
          aria-label="City search"
          autocomplete="off"
          placeholder="Enter city name"
        />
        <button
          id="searchBtn"
          type="button"
          aria-label="Search weather for city"
        >
          Search
        </button>
      </div>

      <button id="locationBtn" type="button" aria-label="Use current location">
        Use Current Location
      </button>

      <div id="statusMessage" class="status-message" aria-live="polite"></div>

      <div id="weatherResult">
        <h2 id="city"></h2>
        <img id="weatherIcon" src="" alt="" style="display: none" />
        <p id="temp"></p>
        <p id="condition"></p>
        <p id="humidity"></p>
        <p id="wind"></p>
      </div>

      <!-- 3-Day Forecast Container -->
      <div id="forecastContainer"></div>
    </div>
    <script src="config.js"></script>
    <script src="script.js"></script>
  </body>
</html>
